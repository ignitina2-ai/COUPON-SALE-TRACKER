name: Release apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag v$tagVersion does not match package version $packageVersion"
          }
      - name: Build installer
        run: npm run desktop:build
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Build Android APK
        run: |
          npm run build
          npx cap sync android
          cd android
          bash ./gradlew assembleDebug
      - name: Upload Android release file
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files/windows
      - name: Download Android release file
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files/android
      - name: Rename Android APK
        run: mv release-files/android/app-debug.apk "release-files/android/SCC-Coupon-Sale-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/windows/*
            release-files/android/*.apk
          fail_on_unmatched_files: true
